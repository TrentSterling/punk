name: Project theme browser checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: project-theme-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  theme-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PROJECT_ID: punk
      PROJECT_BASELINE_ROOT: ${{ github.workspace }}/.local/baseline
      PROJECT_SCREENSHOTS: ${{ github.workspace }}/.local/theme-review
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read complete base for original composition and media checks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .local/baseline
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test shared engine and project state
        run: node --test tools/project-theme/test.cjs tools/theme-review/bridge-test.cjs tools/theme-review/server.test.cjs tools/theme-review/stress.test.cjs
      - name: Check original content and media preservation
        run: node tools/theme-review/source.cjs
      - name: Install pinned browser tooling and official Chrome
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/project-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/project-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/project-tests/node_modules" >> "$GITHUB_ENV"
      - name: Test native and custom project themes in Chrome
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 360s node tools/theme-review/browser.cjs
      - name: Stress first-click in-page editor and iframe restoration
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 180s node tools/theme-review/stress.cjs
      - name: Save public-site local preview screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: punk-theme-review-${{ github.event.pull_request.number }}
          path: |
            .local/theme-review/*.png
            .local/theme-review/*.json
            .local/theme-review/stress/*.png
            .local/theme-review/stress/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  native-pointer-diagnostic:
    name: Native pointer first-click regression
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PROJECT_ID: punk
      PROJECT_BASELINE_ROOT: ${{ github.workspace }}/.local/baseline
      PROJECT_SCREENSHOTS: ${{ github.workspace }}/.local/theme-review
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
      THEME_NATIVE_POINTER_DISPLAY_ISOLATED: '1'
    steps:
      - name: Read exact tested head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read original project baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cad83d925ad2ef79b1efad4ad7da726f58535543
          path: .local/baseline
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check diagnostic boundaries and exact input accounting
        run: node --test tools/theme-review/modal-routing.test.cjs tools/theme-review/native-pointer.test.cjs tools/theme-review/native-routing.test.cjs
      - name: Install pinned tooling, official Chrome, and Ubuntu XTEST helper
        run: |
          npm install --prefix "$RUNNER_TEMP/project-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/project-tests/node_modules/playwright/cli.js" install --with-deps chrome
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xdotool
          echo "NODE_PATH=$RUNNER_TEMP/project-tests/node_modules" >> "$GITHUB_ENV"
      - name: Exercise single native pointer activations on an isolated display
        run: |
          command -v xvfb-run
          timeout 240s xvfb-run -a --server-args="-screen 0 1920x1200x24" node tools/theme-review/native-routing.cjs
      - name: Retain local public-page native-input evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: punk-native-routing-${{ github.event.pull_request.number }}
          path: .local/theme-review/native-routing/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
