name: Citylab first visual review
on:
  push:
    branches: [main]
    paths: ['citylab/refine-v01.py']
permissions:
  contents: write
jobs:
  refine-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-checked visual review fixes
        run: python3 citylab/refine-v01.py
      - name: Install pinned renderer and browser
        run: |
          mkdir -p /tmp/citylab-deps
          cd /tmp/citylab-deps
          npm init -y
          npm install --ignore-scripts three@0.180.0 playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/citylab/vendor"
          cp -r node_modules/three/build "$GITHUB_WORKSPACE/citylab/vendor/"
          cp -r node_modules/three/examples/jsm "$GITHUB_WORKSPACE/citylab/vendor/addons"
          cp node_modules/three/LICENSE "$GITHUB_WORKSPACE/citylab/vendor/THREE-LICENSE"
      - name: Build and verify online and offline entries
        run: |
          node --check citylab/citylab.js
          mkdir -p citylab/qa
          node citylab/check_locomotion.mjs | tee citylab/qa/locomotion-checks.json
          python3 citylab/build_standalone.py
          python3 -m http.server 8080 >/tmp/citylab-http.log 2>&1 &
          NODE_PATH=/tmp/citylab-deps/node_modules node citylab/qa.cjs
          NODE_PATH=/tmp/citylab-deps/node_modules node citylab/offline-qa.cjs
      - name: Commit verified renderer and standalone build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add citylab/citylab.js citylab/HACKERPUNK-Citylab-v0.1.html
          git commit -m 'Fix Citylab skyline grounding, bridge trusses and upper-deck viewpoint; add offline build'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackerpunk-citylab-reviewed-build
          path: citylab/
          retention-days: 30
