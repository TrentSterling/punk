name: Citylab v02 district rebuild
on:
  push:
    branches: [main]
    paths: ['citylab/refine-v02.py']
permissions:
  contents: write
concurrency:
  group: citylab-v02-review
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and refine reviewed source
        run: |
          python3 -c "from pathlib import Path; import subprocess; s=Path('citylab/citylab.js').read_text(); subprocess.run(['python3','citylab/upgrade-v02.py'],check=True) if \"const VERSION='0.1.1'\" in s else None"
          python3 citylab/refine-v02.py
      - name: Install pinned browser and renderer
        run: |
          mkdir -p /tmp/citylab-deps
          cd /tmp/citylab-deps
          npm init -y
          npm install --ignore-scripts three@0.180.0 playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p "$GITHUB_WORKSPACE/citylab/vendor"
          cp -r node_modules/three/build "$GITHUB_WORKSPACE/citylab/vendor/"
          cp -r node_modules/three/examples/jsm "$GITHUB_WORKSPACE/citylab/vendor/addons"
          cp node_modules/three/LICENSE "$GITHUB_WORKSPACE/citylab/vendor/THREE-LICENSE"
      - name: Geometry and bounded single-frame browser checks
        run: |
          node --check citylab/citylab.js
          node --check citylab/districts.js
          (cd citylab && node test-districts.mjs)
          node citylab/check_locomotion.mjs
          python3 citylab/build_standalone.py
          python3 -m http.server 8080 >/tmp/citylab-http.log 2>&1 &
          NODE_PATH=/tmp/citylab-deps/node_modules node citylab/qa-v02.cjs
      - name: Save verified application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add citylab/citylab.js citylab/districts.js citylab/index.html citylab/build_standalone.py citylab/HACKERPUNK-Citylab-v0.2.html
          git commit -m 'Publish six Citylab districts and recessed detail surfaces after browser review'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackerpunk-citylab-v02-evidence
          path: citylab/
          retention-days: 30
